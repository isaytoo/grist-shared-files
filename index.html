<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Grist Shared Files - SPI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #1e293b; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; }
    .file-card { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
    .file-card:hover { border-color: #ef4444; }
    .icon { font-size: 28px; }
    .info { flex: 1; }
    .info strong { display: block; font-size: 14px; }
    .info span { font-size: 12px; color: #94a3b8; }
    a.dl { padding: 8px 16px; background: #ef4444; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; }
    a.dl:hover { background: #dc2626; }
  </style>
</head>
<body>
  <h1>📦 Fichiers partagés Grist</h1>
  <p>Fichiers Grist à partager avec la communauté.</p>
  <div class="file-card">
    <div class="icon">📄</div>
    <div class="info">
      <strong>meswidgets.grist</strong>
      <span>Document Grist avec widgets personnalisés</span>
    </div>
    <a class="dl" href="/meswidgets.grist" download>Télécharger</a>
  </div>
</body>
</html>
